name: Deploy Backend

on:
  workflow_call:
    secrets:
      VM_HOST:
        required: true
      VM_USER:
        required: true
      VM_SSH_KEY:
        required: true
      VM_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-crossworld_backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.VM_HOST }}
      DEPLOY_USER: ${{ secrets.VM_USER }}
    steps:
      - name: Reject a superseded deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo "::error::This run no longer matches the production branch. The latest push has its own pipeline."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: backend-runtime
          path: release
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}
      - name: Configure the trusted VM host key
        env:
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy and check the public endpoint
        run: bash .github/scripts/deploy.sh release
